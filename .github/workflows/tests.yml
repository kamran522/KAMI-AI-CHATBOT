name: Node tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: bash -n scripts/update-bot.sh
      # The unchanged FFmpeg conversion path was validated on previous commits.
      # Avoid letting a slow Ubuntu package mirror block PR auto-merging.
      - name: Install FFmpeg for full test on main
        if: github.event_name == 'push'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check voice.js && node --check kami.js && node --check index.js && node --check scripts/check-voice.js && node --check groq.js && node --check scripts/check-groq.js
      - run: npm test

  auto-merge:
    needs: test
    # Only merge the owner's own branches inside this repository, after tests pass.
    # External contributor PRs still require manual review.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'kamran522' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge successful owner pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR_NUMBER" --merge --match-head-commit "$HEAD_SHA"
